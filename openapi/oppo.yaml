openapi: 3.1.0
info:
  title: oppo Voice API
  version: 0.1.0
  description: |
    Audio-first API for oppo. The UI may be invisible; the API exposes the
    conversation boundary between the browser and the Mastra agent.
servers:
  - url: http://localhost:4111
    description: Local Mastra server
paths:
  /api/agents/oppoAgent/generate:
    post:
      operationId: generateOppoReply
      summary: Generate a reply from oppo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Generated response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          description: Invalid request
        '500':
          description: Agent or model error
components:
  schemas:
    GenerateRequest:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Message'
    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
    GenerateResponse:
      type: object
      properties:
        text:
          type: string
          description: Text response to be spoken by the browser
        usage:
          type: object
          additionalProperties: true
