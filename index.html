<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020204" />
    <title>oppo — presence</title>
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
  </head>
  <body>
    <main class="app" aria-label="oppo">
      <header>
        <p class="eyebrow">oppo</p>
        <h1>声を置く。</h1>
        <p>話す。聴く。返す。</p>
      </header>

      <section class="composer" aria-labelledby="composer-title">
        <h2 id="composer-title">oppo</h2>
        <form id="voice-form" hx-on:submit="return false">
          <div class="record-area">
            <button id="record" class="record" type="button" aria-label="話しかける" aria-pressed="false">●</button>
            <span id="recording-time" class="recording-time" aria-live="polite"></span>
          </div>
          <label class="sr-only" for="transcript">声の内容</label>
          <textarea id="transcript" name="transcript" required maxlength="500" placeholder="話す"></textarea>
          <div class="actions">
            <button id="submit" type="submit">声を置く</button>
            <button id="speak" type="button" class="secondary">聴く</button>
          </div>
        </form>
        <p id="status" class="status" role="status"></p>
      </section>

      <section aria-labelledby="voices-title">
        <h2 id="voices-title">声</h2>
        <div id="voices"></div>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
